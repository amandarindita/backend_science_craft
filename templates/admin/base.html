<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Science Craft Superadmin{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Toast Container (Responsive) -->
    <div id="toast-container" class="fixed top-3 left-3 right-3 sm:left-auto sm:right-5 sm:top-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Global Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200 transform transition-all text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4" id="confirm-icon-box">
                <i data-lucide="trash-2" class="w-6 h-6" id="confirm-icon"></i>
            </div>
            <h3 class="text-base font-bold text-slate-900" id="confirm-title">Konfirmasi Hapus</h3>
            <p class="text-xs text-slate-500 mt-2 leading-relaxed" id="confirm-message">Apakah Anda yakin ingin melakukan tindakan ini?</p>
            
            <div class="mt-6 flex items-center space-x-3">
                <button type="button" onclick="closeConfirmModal()"
                        class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                    Batal
                </button>
                <button type="button" id="confirm-action-btn"
                        class="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md shadow-rose-600/20 transition-all flex items-center justify-center space-x-1.5">
                    <span id="confirm-btn-text">Ya, Hapus</span>
                </button>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    <script>
        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            const isError = type === 'error';
            const isInfo = type === 'info';

            const bgClass = isSuccess ? 'bg-emerald-600 text-white' : (isError ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white');
            const iconName = isSuccess ? 'check-circle' : (isError ? 'alert-circle' : 'info');

            toast.className = `${bgClass} pointer-events-auto px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 transform translate-y-[-10px] sm:translate-y-0 sm:translate-x-10 opacity-0 w-full sm:min-w-[280px] sm:max-w-md border border-white/10`;
            toast.innerHTML = `
                <i data-lucide="${iconName}" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-xs sm:text-sm font-medium flex-1">${message}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-10px]', 'sm:translate-x-10', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // CONFIRMATION MODAL HELPER
        let confirmActionCallback = null;

        function showConfirmDialog({
            title = 'Konfirmasi Tindakan',
            message = 'Apakah Anda yakin?',
            confirmText = 'Ya, Hapus',
            confirmType = 'danger',
            onConfirm = null
        }) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerHTML = message;
            document.getElementById('confirm-btn-text').innerText = confirmText;

            const iconBox = document.getElementById('confirm-icon-box');
            const actionBtn = document.getElementById('confirm-action-btn');
            const icon = document.getElementById('confirm-icon');

            if (confirmType === 'danger') {
                iconBox.className = 'w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4';
                actionBtn.className = 'flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md shadow-rose-600/20 transition-all flex items-center justify-center space-x-1.5';
                icon.setAttribute('data-lucide', 'trash-2');
            } else {
                iconBox.className = 'w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center mx-auto mb-4';
                actionBtn.className = 'flex-1 py-2.5 px-4 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-md shadow-sky-600/20 transition-all flex items-center justify-center space-x-1.5';
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            lucide.createIcons();

            confirmActionCallback = onConfirm;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmActionCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', async () => {
            if (confirmActionCallback) {
                const btn = document.getElementById('confirm-action-btn');
                const originalContent = btn.innerHTML;
                btn.disabled = true;
                btn.classList.add('opacity-50');
                btn.innerHTML = `<span class="animate-spin mr-1.5">⏳</span> Sedang menghapus...`;
                try {
                    await confirmActionCallback();
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    btn.innerHTML = originalContent;
                    closeConfirmModal();
                }
            } else {
                closeConfirmModal();
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
